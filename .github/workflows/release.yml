name: 发布 Linux 二进制

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 测试并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试
        run: go test ./...

      - name: 构建 Linux 发布包
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          mkdir -p dist build

          for arch in amd64 arm64; do
            package_dir="build/linux-${arch}"
            mkdir -p "${package_dir}"

            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath \
              -ldflags="-s -w -X ctm/internal/version.Version=${version#v} -X ctm/internal/version.BuildType=release" \
              -o "${package_dir}/ctm" ./cmd/ctm

            tar -C "${package_dir}" -czf \
              "dist/ctm-${version}-linux-${arch}.tar.gz" ctm
          done

          cp deploy/install.sh dist/install.sh
          cp deploy/bootstrap.sh dist/bootstrap.sh
          chmod 0755 dist/install.sh dist/bootstrap.sh
          (
            cd dist
            sha256sum ctm-*.tar.gz install.sh bootstrap.sh > SHA256SUMS
          )

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 更新说明统一用简体中文：取本版本提交信息，不用 --generate-notes 的英文模板
          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## 本次更新"
            echo
            git log -1 --pretty=%B
          } >"${notes_file}"

          gh release create "${GITHUB_REF_NAME}" \
            dist/ctm-*.tar.gz \
            dist/install.sh \
            dist/bootstrap.sh \
            dist/SHA256SUMS \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${notes_file}"
